  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <g stroke="url(#v)" stroke-width="4" stroke-linecap="round"><line x1="14" y1="16.0" x2="14" y2="26.0"/><line x1="20" y1="20.8" x2="20" y2="35.8"/><line x1="26" y1="26.2" x2="26" y2="45.2"/><line x1="32" y1="30.0" x2="32" y2="56.0"/><line x1="38" y1="26.2" x2="38" y2="45.2"/><line x1="44" y1="20.8" x2="44" y2="35.8"/><line x1="50" y1="16.0" x2="50" y2="26.0"/></g>
