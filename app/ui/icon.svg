<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25272d"/><stop offset="1" stop-color="#121316"/></linearGradient>
    <linearGradient id="v" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="0" y2="400">
      <stop offset="0" stop-color="#ffd29a"/><stop offset=".55" stop-color="#e9a15b"/><stop offset="1" stop-color="#d9772f"/></linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e9a15b" stop-opacity=".2"/><stop offset="1" stop-color="#e9a15b" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="256" cy="256" r="190" fill="url(#halo)"/>
